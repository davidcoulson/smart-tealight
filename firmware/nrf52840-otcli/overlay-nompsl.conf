# Experiment: run the nRF 802.15.4 driver without the MPSL timeslot /
# multiprotocol layer (no BLE in this build anyway). Tests whether aborted
# receptions right after a data poll come from timeslot arbitration.
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=n
CONFIG_OPENTHREAD_CUSTOM_PARAMETERS="OPENTHREAD_CONFIG_MAC_DATA_POLL_TIMEOUT=500"
CONFIG_MPSL=n
CONFIG_NRF_802154_SL_OPENSOURCE=y
