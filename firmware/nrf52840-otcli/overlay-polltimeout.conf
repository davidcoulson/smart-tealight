# Experiment: build OpenThread from source so the child's data-poll listen
# window (time it keeps the radio on after a poll ACKed with frame-pending)
# can be raised from the 100 ms default. Tests the "network-RCP latency"
# theory for the MR4U's failed indirect transmissions.
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=n
CONFIG_OPENTHREAD_CUSTOM_PARAMETERS="OPENTHREAD_CONFIG_MAC_DATA_POLL_TIMEOUT=500"
