# OpenThread CLI on the XIAO nRF52840 — link-diagnostic tool for the tea light.
# Same radio/board as the Matter build, no Matter: `ot mode`, `ot parent`,
# `ot ping`, `ot counters mac` let us test MTD-vs-FTD delivery on the mesh.
CONFIG_OPENTHREAD=y
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=y
CONFIG_NORDIC_QSPI_NOR=n

# Console + shell on the chip's USB CDC ACM (no debug probe on the XIAO).
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Smart Tealight"
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Thread CLI nRF52840"
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0x0101
