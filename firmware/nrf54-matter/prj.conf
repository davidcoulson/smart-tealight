# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Light Bulb"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/light_bulb.zap"

# 32773 == 0x8005 (example lighting-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y
CONFIG_PWM=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterLight"

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# ---- smart-tealight: sleepy end device (ICD) ----
# An ICD must be a sleepy MTD. The light_bulb sample defaults to FTD, which
# made this board come up as a Thread ROUTER ("Setting OpenThread device type
# to ROUTER") with the radio permanently on — same fix as nrf52840-matter.
CONFIG_OPENTHREAD_FTD=n
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y

# Don't migrate the DAC private key into the CRACEN KMU. It defaults on when
# CRACEN_LIB_KMU is available, rewrites the factory-data partition at first
# boot, and faults here (undefined instruction inside
# FactoryDataProvider::MoveDACPrivateKeyToSecureStorage -> flash.h:611) because
# the part is not in a secure state. The key stays in factory data, which is
# fine for a development device using test credentials.
# CHIP_CRYPTO_PSA_DAC_PRIV_KEY_KMU is a *choice* member, so setting it to n is
# a silent no-op (the rebuilt image came out byte-identical). Disable the
# parent instead, which turns the whole migration off.
CONFIG_CHIP_CRYPTO_PSA_MIGRATE_DAC_PRIV_KEY=n

# Thread TX is already at the +8 dBm maximum (CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8),
# but BLE was left at 0 dBm, and commissioning kept dying with BLE supervision
# timeouts (GAP reason 0x08) whenever the board sat near the border router
# instead of near the commissioner. Match BLE to the Thread radio.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# OpenThread CLI on the existing Zephyr shell (uart20, 115200): lets us
# pre-provision the Thread dataset over serial (`ot dataset set active …`,
# `ot ifconfig up`, `ot thread start`) so the device is settled on the mesh
# before Matter commissioning starts, and gives `ot parent` / `ot counters`
# on the real device.
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416
# `ot dataset set active <tlv>` overflowed the default shell stack
# (FATAL ERROR 2, thread shell_uart). 256 KB of SRAM; be generous.
CONFIG_SHELL_STACK_SIZE=8192

CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=1000
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=500

# nRF 802.15.4 SL temperature compensation needs the sensor subsystem + temp node
CONFIG_SENSOR=y

# ---- bring-up: no bootloader, so no OTA / DFU (they need MCUboot's bootutil) ----
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_DFU_OVER_BT_SMP=n
CONFIG_MCUMGR=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_BOOTUTIL_LIB=n
CONFIG_CHIP_BOOTLOADER_NONE=y

# ---- bring-up: no NFC (the XIAO exposes no NFC antenna pins; the NFC T2T lib
# was being linked without its platform glue -> undefined nfc_platform_event_handler)
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_NFC_T2T_NRFXLIB=n
