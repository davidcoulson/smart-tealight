# OpenThread RCP on the XIAO nRF52840, spinel over the board's USB CDC ACM.
# Plug it into the machine running otbr-agent (device /dev/ttyACM0, 115200
# is ignored on CDC; hardware flow control off).
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_COPROCESSOR=y
CONFIG_OPENTHREAD_COPROCESSOR_RCP=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_RCP=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000
CONFIG_USE_SEGGER_RTT=n
CONFIG_GPIO=n
CONFIG_NORDIC_QSPI_NOR=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Smart Tealight"
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Thread RCP nRF52840"
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0x0102
CONFIG_UART_LINE_CTRL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1120
