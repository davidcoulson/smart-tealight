<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="Helvetica, Arial, sans-serif"><rect width="1240" height="960" fill="#fff"/><text x="20" y="34" font-size="20" text-anchor="start" fill="#222" font-weight="bold">Tea light current measurement — PPK2 + XIAO nRF54L15 + 802030 cell</text><text x="20" y="56" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">XIAO USB-C must be UNPLUGGED in both setups: it powers the onboard debugger and runs the charger, which swamps the reading.</text><rect x="20" y="90" width="1200" height="300" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5"/><text x="36" y="116" font-size="15" text-anchor="start" fill="#222" font-weight="bold">A.  Source-meter mode — PPK2 replaces the battery  (do this first)</text><rect x="120" y="160" width="210" height="150" rx="6" fill="#e8f0fe" stroke="#222" stroke-width="2"/><text x="225" y="182" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Nordic PPK2</text><text x="225" y="200" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">micro-USB → laptop (Power Profiler app)</text><circle cx="330" cy="230" r="4" fill="#ef6c00"/><text x="338" y="234" font-size="11" text-anchor="start" fill="#ef6c00" font-weight="bold">VIN</text><circle cx="330" cy="260" r="4" fill="#c62828"/><text x="338" y="264" font-size="11" text-anchor="start" fill="#c62828" font-weight="bold">VOUT</text><circle cx="330" cy="290" r="4" fill="#222"/><text x="338" y="294" font-size="11" text-anchor="start" fill="#222" font-weight="bold">GND</text><rect x="760" y="160" width="200" height="150" rx="6" fill="#e3f2fd" stroke="#222" stroke-width="2"/><text x="860" y="182" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">XIAO nRF54L15</text><text x="860" y="200" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">battery pads on the underside</text><circle cx="760" cy="260" r="4" fill="#c62828"/><text x="752" y="264" font-size="11" text-anchor="end" fill="#c62828" font-weight="bold">BAT+</text><circle cx="760" cy="290" r="4" fill="#222"/><text x="752" y="294" font-size="11" text-anchor="end" fill="#222" font-weight="bold">BAT−</text><rect x="830" y="278" width="60" height="22" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/><text x="860" y="272" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">USB-C</text><polyline points="834,280 886,298" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><polyline points="834,298 886,280" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><text x="860" y="228" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">USB unplugged</text><polyline points="330,260 520,260 520,260 760,260" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><text x="520" y="250" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">VOUT → BAT+</text><polyline points="330,290 560,290 560,290 760,290" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><text x="560" y="308" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">GND → BAT−</text><text x="390" y="234" font-size="10" text-anchor="start" fill="#666" font-weight="normal">(VIN unused)</text><text x="36" y="320" font-size="12" text-anchor="start" fill="#1565c0" font-weight="normal">App: Source meter · Supply 3700 mV · Enable power</text><text x="36" y="340" font-size="12" text-anchor="start" fill="#1565c0" font-weight="normal">Sampling 100 kHz · record ≥ 5 min idle, then ≥ 5 min with the light on</text><text x="36" y="360" font-size="12" text-anchor="start" fill="#1565c0" font-weight="normal">Read the AVERAGE over the window — the spikes are the 1 s polls</text><rect x="20" y="410" width="1200" height="380" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5"/><text x="36" y="436" font-size="15" text-anchor="start" fill="#222" font-weight="bold">B.  Ampere-meter mode — PPK2 in series with the real cell</text><rect x="60" y="530" width="130" height="70" rx="6" fill="#fff3e0" stroke="#222" stroke-width="2"/><text x="125" y="550" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">802030 LiPo</text><text x="125" y="565" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">3.7 V 400 mAh, PCM</text><text x="182" y="590" font-size="10" text-anchor="end" fill="#c62828" font-weight="bold">+ red</text><text x="68" y="590" font-size="10" text-anchor="start" fill="#222" font-weight="bold">− blk</text><circle cx="190" cy="580" r="4" fill="#c62828"/><circle cx="60" cy="580" r="4" fill="#222"/><rect x="300" y="480" width="210" height="150" rx="6" fill="#e8f0fe" stroke="#222" stroke-width="2"/><text x="405" y="502" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Nordic PPK2</text><text x="405" y="520" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">micro-USB → laptop (Power Profiler app)</text><circle cx="300" cy="580" r="4" fill="#ef6c00"/><text x="292" y="584" font-size="11" text-anchor="end" fill="#ef6c00" font-weight="bold">VIN</text><circle cx="510" cy="580" r="4" fill="#c62828"/><text x="518" y="584" font-size="11" text-anchor="start" fill="#c62828" font-weight="bold">VOUT</text><circle cx="510" cy="610" r="4" fill="#222"/><text x="518" y="614" font-size="11" text-anchor="start" fill="#222" font-weight="bold">GND</text><rect x="800" y="480" width="200" height="150" rx="6" fill="#e3f2fd" stroke="#222" stroke-width="2"/><text x="900" y="502" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">XIAO nRF54L15</text><text x="900" y="520" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">battery pads on the underside</text><circle cx="800" cy="580" r="4" fill="#c62828"/><text x="792" y="584" font-size="11" text-anchor="end" fill="#c62828" font-weight="bold">BAT+</text><circle cx="800" cy="610" r="4" fill="#222"/><text x="792" y="614" font-size="11" text-anchor="end" fill="#222" font-weight="bold">BAT−</text><rect x="870" y="598" width="60" height="22" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/><text x="900" y="592" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">USB-C</text><polyline points="874,600 926,618" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><polyline points="874,618 926,600" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><text x="900" y="548" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">USB unplugged</text><polyline points="190,580 300,580" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round"/><text x="245.0" y="570" font-size="11" text-anchor="middle" fill="#ef6c00" font-weight="bold">cell + → VIN</text><polyline points="510,580 650,580 650,580 800,580" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><text x="650" y="570" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">VOUT → BAT+</text><polyline points="60,580 36,580 36,710 800,710" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="800,710 800,610" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="510,610 690,610 690,710" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><circle cx="690" cy="710" r="4" fill="#222"/><text x="420" y="702" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">cell −  →  PPK2 GND  →  XIAO BAT−   (one common ground)</text><text x="36" y="740" font-size="12" text-anchor="start" fill="#1565c0" font-weight="normal">App: Ampere meter · Enable power   (PPK2 passes the cell straight through and only measures)</text><text x="36" y="760" font-size="12" text-anchor="start" fill="#1565c0" font-weight="normal">Same recording as A. Any difference from A is the cell's own ESR/leakage — expect it to be tiny.</text><text x="36" y="820" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Before you start</text><text x="36" y="842" font-size="11" text-anchor="start" fill="#222" font-weight="normal">• Polarity: the JST-PH on Chinese pouch cells is NOT standardised — verify red = + with a meter before touching the XIAO's pads. Reversed = dead board.</text><text x="36" y="864" font-size="11" text-anchor="start" fill="#222" font-weight="normal">• Solder the cell's leads to the BAT+ / BAT− pads (or a 2-pin header on them); the XIAO's charger then handles it over USB when you are not measuring.</text><text x="36" y="886" font-size="11" text-anchor="start" fill="#222" font-weight="normal">• Keep the debug probe's USB out for the whole recording. If you need the serial console, take it BEFORE, then unplug and let it settle 2 min.</text><text x="36" y="908" font-size="11" text-anchor="start" fill="#222" font-weight="normal">• What to expect: a flat floor in the tens of µA with a ~10 mA spike every second (the ICD poll). The floor × time is your standby life.</text></svg>