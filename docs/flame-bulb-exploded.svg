<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1040" viewBox="0 0 1180 1040" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><rect x="444.2" y="927.5" width="71.5" height="60.5" rx="3" fill="#c9c9c9" stroke="#222" stroke-width="1.5" opacity="1.0"/><line x1="444.2" y1="977.0" x2="515.8" y2="977.0" stroke="#888" stroke-width="1"/><line x1="444.2" y1="963.2" x2="515.8" y2="963.2" stroke="#888" stroke-width="1"/><line x1="444.2" y1="949.5" x2="515.8" y2="949.5" stroke="#888" stroke-width="1"/><line x1="444.2" y1="935.8" x2="515.8" y2="935.8" stroke="#888" stroke-width="1"/><rect x="444.2" y="905.5" width="71.5" height="22.0" rx="2" fill="#3a2a1a" stroke="#222" stroke-width="1.5" opacity="1.0"/><rect x="469.0" y="988.0" width="22.0" height="16.5" rx="3" fill="#777" stroke="#222" stroke-width="1.5" opacity="1.0"/><line x1="515.8" y1="957.8" x2="760" y2="957.8" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="515.8" cy="957.8" r="3" fill="#888"/><text x="768.0" y="961.8" font-size="13" text-anchor="start" fill="#111" font-weight="bold">E26 male pigtail plug</text><text x="768.0" y="977.8" font-size="11" text-anchor="start" fill="#555" font-weight="normal">threaded shell + bakelite body, two leads; epoxied into the cup</text><rect x="436.7" y="812.0" width="86.6" height="33.0" rx="2" fill="#555" stroke="#222" stroke-width="1.5" opacity="1.0"/><rect x="443.6" y="810.6" width="72.9" height="28.9" rx="2" fill="#777" stroke="#555" stroke-width="1.5" stroke-dasharray="4 2" opacity="1.0"/><rect x="401.6" y="806.5" width="156.8" height="5.5" rx="2" fill="#555" stroke="#222" stroke-width="1.5" opacity="1.0"/><rect x="407.1" y="797.1" width="145.8" height="9.3" rx="2" fill="#555" stroke="#222" stroke-width="1.5" opacity="1.0"/><line x1="524.0" y1="828.5" x2="760" y2="828.5" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="524.0" cy="828.5" r="3" fill="#888"/><text x="768.0" y="832.5" font-size