ter and cap live in the bore</text><line x1="353.2" y1="487.9" x2="110" y2="487.9" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="353.2" cy="487.9" r="3" fill="#888"/><text x="102.0" y="491.9" font-size="13" text-anchor="end" fill="#111" font-weight="bold">SK6812 RGBWW 144/m, 12 mm strip</text><text x="102.0" y="507.9" font-size="11" text-anchor="end" fill="#555" font-weight="normal">10 columns × 10 px, data-in at the bottom of each</text><line x1="345.7" y1="575.9" x2="110" y2="575.9" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="345.7" cy="575.9" r="3" fill="#888"/><text x="102.0" y="579.9" font-size="13" text-anchor="end" fill="#111" font-weight="bold">5 V ring at the base of the mast (22 AWG)</text><text x="102.0" y="595.9" font-size="11" text-anchor="end" fill="#555" font-weight="normal">star-feeds all 10 columns</text><rect x="321.6" y="122.2" width="156.8" height="209.0" rx="2" fill="#fff3c4" stroke="#c9b76a" stroke-width="1.5" opacity="0.85"/><rect x="327.1" y="116.7" width="145.8" height="5.5" rx="6" fill="#fff3c4" stroke="#c9b76a" stroke-width="1.5" opacity="0.85"/><line x1="478.4" y1="221.2" x2="690" y2="221.2" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="478.4" cy="221.2" r="3" fill="#888"/><text x="698.0" y="225.2" font-size="13" text-anchor="start" fill="#111" font-weight="bold">shade  (translucent PETG)</text><text x="698.0" y="241.2" font-size="11" text-anchor="start" fill="#555" font-weight="normal">one piece; slides down over the core onto the base spigot</text><text x="30.0" y="34.0" font-size="20" text-anchor="start" fill="#111" font-weight="bold">Flame bulb — exploded assembly (side view, to scale)</text><text x="30.0" y="56.0" font-size="12" text-anchor="start" fill="#555" font-weight="normal">Ø57 mm, ~154 mm tall including the E26 shell. Dashed = inside a printed part.</text><text x="690.0" y="920.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">Assembly order</text><text x="690.0" y="940.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">1 mains: shell → fuse → HLK-10M05</text><text x="690.0" y="958.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">2 PSU into base, cap closes bottom</text><text x="690.0" y="976.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">3 XIAO + shifter + cap into core</text><text x="690.0" y="994.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">4 strips on facets, ring-feed 5 V</text><text x="690.0" y="1012.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">5 core into base socket</text><text x="690.0" y="1030.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">6 shade over the top</text><line x1="400.0" y1="1050.0" x2="400.0" y2="111.2" stroke="#bbb" stroke-width="1" stroke-dasharray="2 6"/></svg>