11" font-weight="bold">core  (PETG), 10 facets</text><text x="768.0" y="417.3" font-size="11" text-anchor="start" fill="#555" font-weight="normal">XIAO, level shifter and cap live in the bore</text><line x1="433.2" y1="466.0" x2="330" y2="466.0" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="433.2" cy="466.0" r="3" fill="#888"/><text x="322.0" y="470.0" font-size="13" text-anchor="end" fill="#111" font-weight="bold">SK6812 RGBWW 144/m, 12 mm strip</text><text x="322.0" y="486.0" font-size="11" text-anchor="end" fill="#555" font-weight="normal">10 columns × 10 px, data-in at the bottom of each</text><line x1="425.7" y1="554.0" x2="330" y2="554.0" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="425.7" cy="554.0" r="3" fill="#888"/><text x="322.0" y="558.0" font-size="13" text-anchor="end" fill="#111" font-weight="bold">5 V ring at the base of the mast (22 AWG)</text><text x="322.0" y="574.0" font-size="11" text-anchor="end" fill="#555" font-weight="normal">star-feeds all 10 columns</text><rect x="401.6" y="100.3" width="156.8" height="209.0" rx="2" fill="#fff3c4" stroke="#c9b76a" stroke-width="1.5" opacity="0.85"/><rect x="407.1" y="94.8" width="145.8" height="5.5" rx="6" fill="#fff3c4" stroke="#c9b76a" stroke-width="1.5" opacity="0.85"/><line x1="558.4" y1="199.3" x2="760" y2="199.3" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="558.4" cy="199.3" r="3" fill="#888"/><text x="768.0" y="203.3" font-size="13" text-anchor="start" fill="#111" font-weight="bold">shade  (translucent PETG)</text><text x="768.0" y="219.3" font-size="11" text-anchor="start" fill="#555" font-weight="normal">one piece; slides down over the core onto the base spigot</text><text x="30.0" y="34.0" font-size="20" text-anchor="start" fill="#111" font-weight="bold">Flame bulb — exploded assembly (side view, to scale)</text><text x="30.0" y="56.0" font-size="12" text-anchor="start" fill="#555" font-weight="normal">Ø57 mm, ~140 mm tall including the E26 plug. Dashed = inside a printed part.</text><text x="760.0" y="76.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">Assembly order</text><text x="760.0" y="96.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">1 mains: shell → fuse → HLK-10M05</text><text x="760.0" y="113.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">2 PSU into base, cap closes bottom</text><text x="760.0" y="130.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">3 XIAO + shifter + cap into core</text><text x="760.0" y="147.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">4 strips on facets, ring-feed 5 V</text><text x="760.0" y="164.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">5 core into base socket</text><text x="760.0" y="181.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">6 shade over the top</text><line x1="480.0" y1="1010.0" x2="480.0" y2="89.3" stroke="#bbb" stroke-width="1" stroke-dasharray="2 6"/></svg>