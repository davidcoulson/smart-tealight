# Smart tea light — ESPHome over THREAD, SLEEPY END DEVICE (XIAO ESP32-C6)
#
# Phase 2 of tealight-c6-thread.yaml: the radio polls its parent once a
# second (MTD + poll_period) and the CPU light-sleeps between events via the
# esp32_pm component from esphome/esphome#12325 (unmerged; pulled from the
# PR branch as an external component — measured 105 µA average on a C6).
#
# Things to measure on the USB power meter, in this order:
#   1. idle, both lights off            target ≤ 0.2 mA (vs ~17 mA without PM)
#   2. candle mode (LEDC PWM running)   does the PWM survive light sleep?
#   3. ring on                          rail on, CPU busy → no sleep, expected
#   4. HA → light on latency            ≤ poll_period + a bit
# OTA: turn on the "Radio always on" switch first (esphome.ota can't push to
# a sleeping device), then turn it off again afterwards.
#
# Thread credentials come from HA: Settings → Thread → ⋮ → the preferred
# network's dataset (or the otbr/info websocket call). Put them in
# secrets.yaml as thread_channel / thread_network_name / thread_network_key /
# thread_pan_id / thread_ext_pan_id / thread_pskc / thread_mesh_local_prefix.

substitutions:
  name: tealight-sed
  friendly_name: Tealight SED
  ring_leds: "8"
  # Brightness cap for the ring (battery + charger protection). 40 % of 8
  # full-white LEDs is still ~160 mA.
  ring_cap: 40%
  # "true" = U.FL external antenna (bench board), "false" = onboard ceramic
  external_antenna: "false"
  # With name_add_mac_suffix the dashboard would look for ${name}.local, which
  # doesn't exist. Give it the real hostname (or the fd99:… IPv6 address).
  use_address: tealight-thread-1379fc.local

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  # XIAO C6 antenna switch, set before any radio initialises (priority
  # 1000 runs before all component setup). See xiao_c6_rf_switch.h.
  includes:
    - xiao_c6_rf_switch.h
  on_boot:
    priority: 1000
    then:
      - lambda: xiao_c6_rf_switch(${external_antenna});

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret tealight_api_key

ota:
  - platform: esphome
    encryption: # reuses the api encryption key; no separate password

network:
  enable_ipv6: true # Thread is IPv6-only

external_components:
  # Light-sleep power management for ESP-IDF, from the open PR. Pin to a
  # commit once it merges (then delete this block and use the release).
  - source: github://rwrozelle/esphome@power_management1
    components: [power_management, esp32_pm]
    refresh: 1d

power_management:
  - platform: esp32_pm
    id: pm
    enable_light_sleep: true
    max_frequency: 160MHz
    min_frequency: 40MHz # XTAL; the C6 idles here between polls
    idle_time_before_sleep: 3 # FreeRTOS ticks
    # Powers down the TOP domain (RMT, LEDC, ADC...) in light sleep. Start
    # with false so the candle PWM keeps running; try true once idle current
    # is confirmed, and check whether LEDC/RMT survive it.
    power_down_peripherals: false

openthread:
  device_type: MTD
  poll_period: 1000ms # sleepy end device; HA commands land on the next poll
  channel: !secret thread_channel
  network_name: !secret thread_network_name
  network_key: !secret thread_network_key
  pan_id: !secret thread_pan_id
  ext_pan_id: !secret thread_ext_pan_id
  pskc: !secret thread_pskc
  mesh_local_prefix: !secret thread_mesh_local_prefix
  force_dataset: true
  use_address: ${use_address}

# High-side switch for the addressable LEDs' supply (AO3401A + 2N7002).
# ESPHome turns it on before the ring lights and off keep_on_time after it
# goes dark — powered-but-black SK6812s draw ~1 mA each.
power_supply:
  - id: ring_rail
    pin: GPIO21 # D3
    enable_time: 5ms
    keep_on_time: 2s

output:
  # Warm-white candle LED, low-side N-FET (AO3400).
  - platform: ledc
    id: warm_led
    pin: GPIO2 # D2
    frequency: 19531Hz

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: Ring
    pin: GPIO22 # D4
    num_leds: ${ring_leds}
    chipset: WS2812 # SK6812 RGBW(W): chipset SK6812 + channel_colors: GRBW
    channel_colors: GRB
    power_supply: ring_rail
    color_correct: [$ring_cap, $ring_cap, $ring_cap]
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - addressable_flicker:
          name: Candle
          intensity: 8%
      - addressable_rainbow:
          name: Rainbow
          speed: 5
          width: ${ring_leds}
      - addressable_twinkle:
          name: Twinkle
      - addressable_color_wipe:
          name: Color wipe

  # Low-power mode: the ring rail stays off, only the one warm LED runs.
  - platform: monochromatic
    id: candle
    name: Candle
    output: warm_led
    gamma_correct: 2.2
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - flicker:
          name: Flicker
          alpha: 94%
          intensity: 15%

sensor:
  # BAT+ -> 220k -> D0 -> 220k -> GND (the C6 has no on-board divider).
  - platform: adc
    id: vbat
    name: Battery voltage
    pin: GPIO0 # D0
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 4
          send_every: 2
    # Below ~2.5 V nothing is connected to D0 (bench / USB-only), so the
    # low-battery rules must not fire — otherwise the board sleeps forever.
    on_value:
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.5;"
          then:
            - light.turn_off: ring
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.4;"
          then:
            - light.turn_off: candle
            - deep_sleep.enter: ship_mode

  - platform: copy
    source_id: vbat
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.50 -> 0
          - 4.15 -> 100
      - clamp:
          min_value: 0
          max_value: 100


binary_sensor:
  - platform: gpio
    id: tap_button
    name: Button
    pin:
      number: GPIO1 # D1, LP GPIO so it can also wake from deep sleep
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_click:
      # Short press: toggle the low-power candle.
      - min_length: 50ms
        max_length: 600ms
        then:
          - light.toggle: candle
      # Long press: ship / storage mode.
      - min_length: 2s
        max_length: 6s
        then:
          - light.turn_off: ring
          - light.turn_off: candle
          - deep_sleep.enter: ship_mode

switch:
  # Turn on before an OTA push (or for debugging); off again afterwards.
  - platform: template
    name: Radio always on
    id: radio_always_on
    icon: mdi:access-point
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - openthread.set_poll_period: 0ms
    turn_off_action:
      - openthread.set_poll_period: 1000ms

button:
  - platform: template
    name: Ship mode (wake with button)
    on_press:
      - light.turn_off: ring
      - light.turn_off: candle
      - deep_sleep.enter: ship_mode

deep_sleep:
  id: ship_mode
  wakeup_pin:
    number: GPIO1
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
