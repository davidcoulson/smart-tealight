# Smart tea light — ESPHome over THREAD, SLEEPY END DEVICE (XIAO ESP32-C6)
#
# Attach workaround (2026-09-26): ESPHome applies the Thread link mode in
# apply_linkmode_() *before* the dataset is activated and the stack is
# started, and the restored NetworkInfo then clobbers it — an MTD ends up
# advertising (rx_on=0, dev=0, nd=0), i.e. sleepy, from its very first Child
# ID Request, and the attach never completes (Child ID Request -> no
# response, DataReq -> NoAck, forever). Re-asserting rx_on_when_idle=1 once
# the stack is running attaches as a child in ~1 s. So: come up as a Minimal
# End Device, attach, then go sleepy from the go_sleepy script.
#
# Phase 2 of tealight-c6-thread.yaml: the radio polls its parent once a
# second (MTD + poll_period) and the CPU light-sleeps between events via the
# esp32_pm component from esphome/esphome#12325 (unmerged; pulled from the
# PR branch as an external component — measured 105 µA average on a C6).
#
# Things to measure on the USB power meter, in this order:
#   1. idle, both lights off            target ≤ 0.2 mA (vs ~17 mA without PM)
#   2. candle mode (LEDC PWM running)   does the PWM survive light sleep?
#   3. ring on                          rail on, CPU busy → no sleep, expected
#   4. HA → light on latency            ≤ poll_period + a bit
# OTA: turn on the "Radio always on" switch first (esphome.ota can't push to
# a sleeping device), then turn it off again afterwards.
#
# Thread credentials come from HA: Settings → Thread → ⋮ → the preferred
# network's dataset (or the otbr/info websocket call). Put them in
# secrets.yaml as thread_channel / thread_network_name / thread_network_key /
# thread_pan_id / thread_ext_pan_id / thread_pskc / thread_mesh_local_prefix.

substitutions:
  name: tealight-sed
  friendly_name: Tealight SED
  ring_leds: "8"
  # Brightness cap for the ring (battery + charger protection). 40 % of 8
  # full-white LEDs is still ~160 mA.
  ring_cap: 40%
  # "true" = U.FL external antenna (bench board), "false" = onboard ceramic
  external_antenna: "false"
  # With name_add_mac_suffix the dashboard would look for ${name}.local, which
  # doesn't exist. Give it the real hostname (or the fd99:… IPv6 address).
  use_address: tealight-sed-1379fc.local

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  # XIAO C6 antenna switch, set before any radio initialises (priority
  # 1000 runs before all component setup). See xiao_c6_rf_switch.h.
  includes:
    - xiao_c6_rf_switch.h
  on_boot:
    - priority: 1000
      then:
        - lambda: xiao_c6_rf_switch(${external_antenna});
    # Auto-sleepy is back ON. It was disabled because the attach watchdog had
    # no hysteresis and cancelled sleepy at the first transient detach, which
    # left the radio awake while the switch still read "on". The watchdog now
    # gives sleepy two minutes and falls back honestly if it cannot hold.

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      # REQUIRED for sleepy operation. Espressif's ot_sleepy_device reference
      # sets this, and esp32_pm only disables ND6 when poll_period is set at
      # COMPILE time — we set it at runtime, so that guard never fires.
      # With ND6 on, IPv6 Neighbour Discovery keeps probing; once the radio
      # stops listening the probes fail, the neighbour goes unreachable and
      # the interface drops ("Network down; disconnect") within seconds.
      CONFIG_LWIP_ND6: "n"
      # ESP-IDF blocks automatic light sleep while the USB Serial/JTAG
      # peripheral is connected to a host, so any USB-side power measurement
      # reads the never-sleeping number. Allow sleep regardless.
      CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION: "n"
      # Pure IPv6 to HA; the DNS64 client is never used.
      CONFIG_OPENTHREAD_DNS64_CLIENT: "n"
      # Was recalibrating the internal RC oscillator on *every* sleep entry.
      CONFIG_PM_LIGHTSLEEP_RTC_OSC_CAL_INTERVAL: "8"
      # TEST 2026-09-28: these three are what esp32_pm's enable_light_sleep
      # pulls in. They power down the radio/baseband across light sleep and
      # rely on the RTC slow clock to bring it back at the right instant.
      # This board has no 32.768 kHz crystal (internal RC, ~5% drift), which
      # is the likeliest reason a SED can never complete an MLE attach here.
      # ESPHome's sdkconfig entries are sticky, so they must be set "n"
      # explicitly — clearing enable_light_sleep alone does not remove them.
      CONFIG_IEEE802154_SLEEP_ENABLE: "y"
      CONFIG_ESP_PHY_MAC_BB_PD: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"

globals:
  - id: detached_since
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: sleepy_gave_up
    type: bool
    restore_value: false
    initial_value: "false"

logger:
  level: DEBUG
  # No UART/USB console: the peripheral costs power and keeps a clock domain
  # alive. Logs still reach HA and `esphome logs` over the API.
  # baud_rate: 0   # TEMPORARILY ON for link-mode debugging over serial

api:
  encryption:
    key: !secret tealight_api_key

ota:
  - platform: esphome
    encryption: # reuses the api encryption key; no separate password

network:
  enable_ipv6: true # Thread is IPv6-only

external_components:
  # Light-sleep power management for ESP-IDF, from the open PR. Pin to a
  # commit once it merges (then delete this block and use the release).
  - source: github://rwrozelle/esphome@power_management1
    components: [power_management, esp32_pm]
    refresh: 1d

power_management:
  - platform: esp32_pm
    id: pm
    # TEST 2026-09-28: light sleep OFF. It pulls in CONFIG_ESP_PHY_MAC_BB_PD +
    # CONFIG_IEEE802154_SLEEP_ENABLE, which power the radio down and rely on
    # the RTC slow clock to wake it. This board has no 32.768 kHz crystal
    # ("32k XTAL: not in use" -> internal RC, ~5% drift), so the radio wakes at
    # the wrong instant and the SED can never complete an MLE attach.
    # A SED's radio duty-cycling comes from the OpenThread MAC (rx_on=false)
    # anyway, so sleepy should still work without this.
    enable_light_sleep: true
    max_frequency: 160MHz
    min_frequency: 40MHz # XTAL; the C6 idles here between polls
    idle_time_before_sleep: 3 # FreeRTOS ticks
    # Powers down the TOP domain (RMT, LEDC, ADC...) in light sleep. Start
    # with false so the candle PWM keeps running; try true once idle current
    # is confirmed, and check whether LEDC/RMT survive it.
    power_down_peripherals: false

openthread:
  device_type: MTD
  # TEST 2026-09-28: poll_period at COMPILE time, so the device comes up as a
  # sleepy end device instead of attaching as MED and switching later. This is
  # what Espressif's ot_sleepy_device reference does, and it is the only shape
  # esp32_pm's own ND6 guard recognises. Runtime-switching to sleepy has never
  # once managed to attach (always role=1 for the full grace period).
  poll_period: 1000ms
  channel: !secret thread_channel
  network_name: !secret thread_network_name
  network_key: !secret thread_network_key
  pan_id: !secret thread_pan_id
  ext_pan_id: !secret thread_ext_pan_id
  pskc: !secret thread_pskc
  mesh_local_prefix: !secret thread_mesh_local_prefix
  force_dataset: true
  use_address: ${use_address}

# High-side switch for the addressable LEDs' supply (AO3401A + 2N7002).
# ESPHome turns it on before the ring lights and off keep_on_time after it
# goes dark — powered-but-black SK6812s draw ~1 mA each.
power_supply:
  - id: ring_rail
    pin: GPIO21 # D3
    enable_time: 5ms
    keep_on_time: 2s

output:
  # Warm-white candle LED, low-side N-FET (AO3400).
  - platform: ledc
    id: warm_led
    pin: GPIO2 # D2
    frequency: 19531Hz

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: Ring
    pin: GPIO22 # D4
    num_leds: ${ring_leds}
    chipset: WS2812 # SK6812 RGBW(W): chipset SK6812 + channel_colors: GRBW
    channel_colors: GRB
    power_supply: ring_rail
    color_correct: [$ring_cap, $ring_cap, $ring_cap]
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - addressable_flicker:
          name: Candle
          intensity: 8%
      - addressable_rainbow:
          name: Rainbow
          speed: 5
          width: ${ring_leds}
      - addressable_twinkle:
          name: Twinkle
      - addressable_color_wipe:
          name: Color wipe

  # Low-power mode: the ring rail stays off, only the one warm LED runs.
  - platform: monochromatic
    id: candle
    name: Candle
    output: warm_led
    gamma_correct: 2.2
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - flicker:
          name: Flicker
          alpha: 94%
          intensity: 15%

sensor:
  # BAT+ -> 220k -> D0 -> 220k -> GND (the C6 has no on-board divider).
  - platform: adc
    id: vbat
    name: Battery voltage
    pin: GPIO0 # D0
    attenuation: 12db
    update_interval: 300s
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 4
          send_every: 2
    # Below ~2.5 V nothing is connected to D0 (bench / USB-only), so the
    # low-battery rules must not fire — otherwise the board sleeps forever.
    on_value:
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.5;"
          then:
            - light.turn_off: ring
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.4;"
          then:
            - light.turn_off: candle
            - deep_sleep.enter: ship_mode

  - platform: copy
    source_id: vbat
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.50 -> 0
          - 4.15 -> 100
      - clamp:
          min_value: 0
          max_value: 100


binary_sensor:
  - platform: gpio
    id: tap_button
    name: Button
    pin:
      number: GPIO1 # D1, LP GPIO so it can also wake from deep sleep
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_click:
      # Short press: toggle the low-power candle.
      - min_length: 50ms
        max_length: 600ms
        then:
          - light.toggle: candle
      # Long press: ship / storage mode.
      - min_length: 2s
        max_length: 6s
        then:
          - light.turn_off: ring
          - light.turn_off: candle
          - deep_sleep.enter: ship_mode

interval:
  # Attach watchdog, with hysteresis.
  #
  # Two different failures look identical from here (detached + rx-on false):
  #
  #  * boot-time: ESPHome applies the link mode before the stack is started and
  #    the restored NetworkInfo clobbers it, so an MTD comes up sleepy and can
  #    never complete the attach. We never asked for that, so fix it at once.
  #  * while sleepy: a sleepy child detaching briefly is normal. The old
  #    watchdog forced rx-on at the first blink, which silently cancelled
  #    sleepy mode for good while the (optimistic) switch still read "on" —
  #    that is why the board sat at ~60 mA with sleepy apparently enabled.
  #    Give it two minutes, and if it truly cannot hold the link, fall back and
  #    turn the switch off so HA shows what the radio is actually doing.
  - interval: 15s
    then:
      - lambda: |-
          auto lock = esphome::openthread::InstanceLock::acquire();
          if (!lock) return;
          otInstance *inst = lock.get_instance();
          const auto role = otThreadGetDeviceRole(inst);
          otLinkModeConfig m = otThreadGetLinkMode(inst);
          const uint32_t now = millis();
          const bool down = (role == OT_DEVICE_ROLE_DETACHED || role == OT_DEVICE_ROLE_DISABLED);
          ESP_LOGD("ot", "role=%d rx_on=%d poll=%ums", (int) role, (int) m.mRxOnWhenIdle,
                   (unsigned) otLinkGetPollPeriod(inst));
          if (!down) { id(detached_since) = 0; return; }
          if (id(detached_since) == 0) id(detached_since) = now;
          if (m.mRxOnWhenIdle) return;  // already recovering
          const bool asked_for_sleepy = id(sleepy_mode).state;
          const uint32_t grace = asked_for_sleepy ? 120000 : 0;
          if (now - id(detached_since) < grace) return;
          m.mRxOnWhenIdle = true;
          m.mDeviceType = false;
          m.mNetworkData = false;
          otThreadSetLinkMode(inst, m);
          ESP_LOGW("ot", "detached %us: re-asserted rx_on_when_idle=1 to re-attach",
                   (unsigned) ((now - id(detached_since)) / 1000));
          if (asked_for_sleepy) id(sleepy_gave_up) = true;

      # Tell the truth in HA when sleepy had to be abandoned.
      - if:
          condition:
            lambda: "return id(sleepy_gave_up);"
          then:
            - lambda: "id(sleepy_gave_up) = false;"
            - switch.turn_off: sleepy_mode
            - logger.log: "sleepy mode abandoned: parent could not hold the link"


script:
  # Attach first (as a Minimal End Device), let HA connect, then drop to
  # sleepy. Never go sleepy before the attach completes — that is the state
  # the device cannot recover from on its own.
  - id: go_sleepy
    mode: restart
    then:
      - wait_until:
          condition:
            api.connected:
      - delay: 60s # let HA's initial API + OTA version probes finish first
      - switch.turn_on: sleepy_mode

switch:
  # OFF at boot = Minimal End Device (radio on) so the attach can complete;
  # go_sleepy turns it ON ~20 s after HA connects. Turn it OFF from HA before
  # an OTA push, since esphome.ota cannot reach a polling device.
  - platform: template
    name: Sleepy mode
    id: sleepy_mode
    icon: mdi:sleep
    optimistic: true
    restore_mode: ALWAYS_ON  # born sleepy: poll_period is compile-time
    turn_on_action:
      - logger.log: "Switching to sleepy end device (1 s poll)"
      - openthread.set_poll_period: 1000ms
    turn_off_action:
      - logger.log: "Back to Minimal End Device (radio always on)"
      - openthread.set_poll_period: 0ms

button:
  - platform: template
    name: Ship mode (wake with button)
    on_press:
      - light.turn_off: ring
      - light.turn_off: candle
      - deep_sleep.enter: ship_mode

deep_sleep:
  id: ship_mode
  wakeup_pin:
    number: GPIO1
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
