# Smart tea light — ESPHome over THREAD (XIAO ESP32-C6)
#
# Same device as tealight-c6.yaml but the ESPHome API runs over Thread via
# the Home Assistant OTBR instead of Wi-Fi. Phase 1 (this file): FTD, radio
# always on — proves the Thread path. Phase 2: device_type MTD + poll_period
# (sleepy end device) + the esp32_pm light-sleep component for ~100 µA idle.
#
# Thread credentials come from HA: Settings → Thread → ⋮ → the preferred
# network's dataset (or the otbr/info websocket call). Put them in
# secrets.yaml as thread_channel / thread_network_name / thread_network_key /
# thread_pan_id / thread_ext_pan_id / thread_pskc / thread_mesh_local_prefix.

substitutions:
  name: tealight-thread
  friendly_name: Tealight Thread
  ring_leds: "8"
  # Brightness cap for the ring (battery + charger protection). 40 % of 8
  # full-white LEDs is still ~160 mA.
  ring_cap: 40%
  # "true" = U.FL external antenna (bench board), "false" = onboard ceramic
  external_antenna: "false"
  # With name_add_mac_suffix the dashboard would look for ${name}.local, which
  # doesn't exist. Give it the real hostname (or the fd99:… IPv6 address).
  use_address: tealight-thread-1379fc.local

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  # XIAO C6 antenna switch, set before any radio initialises (priority
  # 1000 runs before all component setup). See xiao_c6_rf_switch.h.
  includes:
    - xiao_c6_rf_switch.h
  on_boot:
    priority: 1000
    then:
      - lambda: xiao_c6_rf_switch(${external_antenna});

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret tealight_api_key

ota:
  - platform: esphome
    encryption: # reuses the api encryption key; no separate password

network:
  enable_ipv6: true # Thread is IPv6-only

openthread:
  device_type: FTD # phase 2: MTD + poll_period: 1000ms
  channel: !secret thread_channel
  network_name: !secret thread_network_name
  network_key: !secret thread_network_key
  pan_id: !secret thread_pan_id
  ext_pan_id: !secret thread_ext_pan_id
  pskc: !secret thread_pskc
  mesh_local_prefix: !secret thread_mesh_local_prefix
  force_dataset: true
  use_address: ${use_address}

# High-side switch for the addressable LEDs' supply (AO3401A + 2N7002).
# ESPHome turns it on before the ring lights and off keep_on_time after it
# goes dark — powered-but-black SK6812s draw ~1 mA each.
power_supply:
  - id: ring_rail
    pin: GPIO21 # D3
    enable_time: 5ms
    keep_on_time: 2s

output:
  # Warm-white candle LED, low-side N-FET (AO3400).
  - platform: ledc
    id: warm_led
    pin: GPIO2 # D2
    frequency: 19531Hz

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: Ring
    pin: GPIO22 # D4
    num_leds: ${ring_leds}
    chipset: WS2812 # SK6812 RGBW(W): chipset SK6812 + channel_colors: GRBW
    channel_colors: GRB
    power_supply: ring_rail
    color_correct: [$ring_cap, $ring_cap, $ring_cap]
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - addressable_flicker:
          name: Candle
          intensity: 8%
      - addressable_rainbow:
          name: Rainbow
          speed: 5
          width: ${ring_leds}
      - addressable_twinkle:
          name: Twinkle
      - addressable_color_wipe:
          name: Color wipe

  # Low-power mode: the ring rail stays off, only the one warm LED runs.
  - platform: monochromatic
    id: candle
    name: Candle
    output: warm_led
    gamma_correct: 2.2
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - flicker:
          name: Flicker
          alpha: 94%
          intensity: 15%

sensor:
  # BAT+ -> 220k -> D0 -> 220k -> GND (the C6 has no on-board divider).
  - platform: adc
    id: vbat
    name: Battery voltage
    pin: GPIO0 # D0
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 4
          send_every: 2
    # Below ~2.5 V nothing is connected to D0 (bench / USB-only), so the
    # low-battery rules must not fire — otherwise the board sleeps forever.
    on_value:
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.5;"
          then:
            - light.turn_off: ring
      - if:
          condition:
            lambda: "return x > 2.5 && x < 3.4;"
          then:
            - light.turn_off: candle
            - deep_sleep.enter: ship_mode

  - platform: copy
    source_id: vbat
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.50 -> 0
          - 4.15 -> 100
      - clamp:
          min_value: 0
          max_value: 100


binary_sensor:
  - platform: gpio
    id: tap_button
    name: Button
    pin:
      number: GPIO1 # D1, LP GPIO so it can also wake from deep sleep
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_click:
      # Short press: toggle the low-power candle.
      - min_length: 50ms
        max_length: 600ms
        then:
          - light.toggle: candle
      # Long press: ship / storage mode.
      - min_length: 2s
        max_length: 6s
        then:
          - light.turn_off: ring
          - light.turn_off: candle
          - deep_sleep.enter: ship_mode

button:
  - platform: template
    name: Ship mode (wake with button)
    on_press:
      - light.turn_off: ring
      - light.turn_off: candle
      - deep_sleep.enter: ship_mode

deep_sleep:
  id: ship_mode
  wakeup_pin:
    number: GPIO1
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
