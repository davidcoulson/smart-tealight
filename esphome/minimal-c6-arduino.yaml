# Bench test: same as minimal-c6.yaml but on the Arduino framework, whose
# XIAO C6 board variant sets the RF switch (GPIO3 low, GPIO14 low = onboard
# ceramic antenna) itself before any of our code runs. If this scans networks
# and esp-idf doesn't, the problem is how the switch is driven under IDF.
# If this also finds nothing, suspect the board.
#
#   esphome run minimal-c6-arduino.yaml

esphome:
  name: tealight-min-ard

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:
